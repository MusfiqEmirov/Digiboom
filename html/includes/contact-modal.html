<!-- Əlaqə / konsultasiya modal — contact.html ilə eyni forma -->
<div class="modal fade" id="contactModal" tabindex="-1" aria-labelledby="contactModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered review-modal-dialog contact-modal-dialog">
    <div class="modal-content review-modal-content border-0 shadow-lg">
      <div class="review-modal-accent" aria-hidden="true"></div>
      <div class="modal-header review-modal-header border-0">
        <div class="review-modal-header-text">
          <h3 class="modal-title mb-0" id="contactModalLabel">Konsultasiya</h3>
        </div>
        <button type="button" class="btn-close review-modal-close" data-bs-dismiss="modal" aria-label="Bağlayın"></button>
      </div>
      <div class="modal-body review-modal-body contact-modal-body">
        <p class="contact-modal-lead">Layihəniz və ya sualınız haqqında qısaca yazın — 24 saat ərzində cavab veririk.</p>
        <div data-include="contact-form"
          data-form-id="contact-modal-form"
          data-form-prefix="contact-modal"
          data-form-class="contact-modal-form"
          data-btn-class=""
          data-show-service="true"
          data-smtp-action="/api/contact"></div>
      </div>
    </div>
  </div>
</div>
