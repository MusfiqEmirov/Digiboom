{% load static %}
<!doctype html>
<html lang="{{ LANGUAGE_CODE|default:'az' }}">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DigiBoom — 404</title>
  <link rel="shortcut icon" type="image/png" href="{% static 'images/logos/favicon.svg' %}" />
  <link rel="stylesheet" href="{% static 'css/fonts.css' %}" />
  <link rel="stylesheet" href="{% static 'libs/owl.carousel/dist/assets/owl.carousel.min.css' %}">
  <link rel="stylesheet" href="{% static 'libs/aos-master/dist/aos.css' %}">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
  <link rel="stylesheet" href="{% static 'css/digiboom-additions.css' %}" />
</head>

<body>

  <!--  Page Wrapper -->
  <div class="page-wrapper overflow-hidden">

    <!--  Get in touch Section -->
    <section
      class="bg-light-gray border-top border-primary border-4 d-flex align-items-center justify-content-center min-vh-100">
      <div class="container py-3">
        <div class="d-flex flex-column justify-content-center gap-8">
          <img src="{% static 'images/backgrounds/404.svg' %}" alt="404" width="550" class="img-fluid mx-auto"
            data-aos="zoom-in" data-aos-delay="100" data-aos-duration="1000">
          <h2 class="mb-0 text-center" data-aos="fade-up" data-aos-delay="200" data-aos-duration="1000">Oops! Page Not
            Found</h2>
          <a href="{% url 'home' %}" class="btn mx-auto" data-aos="fade-up" data-aos-delay="300" data-aos-duration="1000">
            <span class="btn-text">Back to Home</span>
            <iconify-icon icon="lucide:arrow-up-right"
              class="btn-icon bg-white text-dark round-52 rounded-circle hstack justify-content-center fs-7 shadow-sm"></iconify-icon>
          </a>
        </div>
      </div>
    </section>

  </div>

  {% include 'includes/floating-widgets.html' %}


  <script src="{% static 'libs/jquery/dist/jquery.min.js' %}"></script>
  <script src="{% static 'libs/bootstrap/dist/js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'libs/owl.carousel/dist/owl.carousel.min.js' %}"></script>
  <script src="{% static 'libs/aos-master/dist/aos.js' %}"></script>
  <script src="{% static 'js/custom.js' %}"></script>
  <script src="{% static 'js/i18n.js' %}"></script>
  <script src="{% static 'js/digiboom.js' %}"></script>
  <!-- solar icons -->
  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>
</body>

</html>
