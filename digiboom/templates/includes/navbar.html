{% load static i18n %}
<nav class="header-nav-desktop d-none d-lg-flex align-items-center">
  <ul class="header-nav-desktop-list list-unstyled mb-0 d-flex align-items-center gap-4">
    <li><a href="{% url 'home' %}" data-nav-link="index" class="header-nav-desktop-link"><img src="{% static 'images/svgs/secondary-leaf.svg' %}" alt="" width="20" height="20" class="img-fluid animate-spin">{% trans "Ana səhifə" %}</a></li>
    <li><a href="{% url 'about' %}" data-nav-link="about-us" class="header-nav-desktop-link"><img src="{% static 'images/svgs/secondary-leaf.svg' %}" alt="" width="20" height="20" class="img-fluid animate-spin">{% trans "Haqqımızda" %}</a></li>
    <li><a href="{% url 'portfolio' %}" data-nav-link="portfolio" class="header-nav-desktop-link"><img src="{% static 'images/svgs/secondary-leaf.svg' %}" alt="" width="20" height="20" class="img-fluid animate-spin">{% trans "Portfolio" %}</a></li>
    <li><a href="{% url 'services' %}" data-nav-link="services" class="header-nav-desktop-link"><img src="{% static 'images/svgs/secondary-leaf.svg' %}" alt="" width="20" height="20" class="img-fluid animate-spin">{% trans "Xidmətlər" %}</a></li>
    <li><a href="{% url 'training' %}" data-nav-link="training" class="header-nav-desktop-link"><img src="{% static 'images/svgs/secondary-leaf.svg' %}" alt="" width="20" height="20" class="img-fluid animate-spin">{% trans "Təlim" %}</a></li>
    <li><a href="{% url 'blog' %}" data-nav-link="blog" class="header-nav-desktop-link"><img src="{% static 'images/svgs/secondary-leaf.svg' %}" alt="" width="20" height="20" class="img-fluid animate-spin">{% trans "Blog" %}</a></li>
  </ul>
  <div class="header-nav-desktop-btns hstack gap-2 ms-4">
    <div class="lang-switcher-host lang-switcher-host--desktop me-1">
      <form action="{% url 'set_language' %}" method="post" class="lang-switcher-form">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <div class="dropdown lang-switcher" data-current-lang="{{ LANGUAGE_CODE|default:'az' }}">
          <button type="button" class="lang-switcher__toggle dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" aria-label="{% trans 'Dil seçimi' %}">
            {% if LANGUAGE_CODE == 'en' %}
            <img src="{% static 'images/flags/flag-en.webp' %}" alt="EN" class="lang-switcher__current-flag" width="22" height="16">
            <span class="lang-switcher__current-label">EN</span>
            {% elif LANGUAGE_CODE == 'ru' %}
            <img src="{% static 'images/flags/flag-ru.webp' %}" alt="RU" class="lang-switcher__current-flag" width="22" height="16">
            <span class="lang-switcher__current-label">RU</span>
            {% else %}
            <img src="{% static 'images/flags/flag-az.webp' %}" alt="AZ" class="lang-switcher__current-flag" width="22" height="16">
            <span class="lang-switcher__current-label">AZ</span>
            {% endif %}
          </button>
          <ul class="dropdown-menu lang-switcher__menu">
            <li>
              <button type="submit" name="language" value="az" class="dropdown-item lang-switcher__option{% if LANGUAGE_CODE == 'az' or not LANGUAGE_CODE %} is-active{% endif %}"{% if LANGUAGE_CODE == 'az' or not LANGUAGE_CODE %} aria-current="true"{% endif %}>
                <img src="{% static 'images/flags/flag-az.webp' %}" alt="" width="22" height="16">
                <span>AZ</span>
              </button>
            </li>
            <li>
              <button type="submit" name="language" value="en" class="dropdown-item lang-switcher__option{% if LANGUAGE_CODE == 'en' %} is-active{% endif %}"{% if LANGUAGE_CODE == 'en' %} aria-current="true"{% endif %}>
                <img src="{% static 'images/flags/flag-en.webp' %}" alt="" width="22" height="16">
                <span>EN</span>
              </button>
            </li>
            <li>
              <button type="submit" name="language" value="ru" class="dropdown-item lang-switcher__option{% if LANGUAGE_CODE == 'ru' %} is-active{% endif %}"{% if LANGUAGE_CODE == 'ru' %} aria-current="true"{% endif %}>
                <img src="{% static 'images/flags/flag-ru.webp' %}" alt="" width="22" height="16">
                <span>RU</span>
              </button>
            </li>
          </ul>
        </div>
      </form>
    </div>
    <a href="{% url 'contact' %}" data-nav-link="contact" class="header-contact-btn">{% trans "Əlaqə və müraciətlər" %}</a>
  </div>
</nav>
